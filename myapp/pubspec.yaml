name: ibasho_stationery
description: IBASHO Stationery e-commerce application
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.0
  http: ^1.6.0
  url_launcher: ^6.3.3
  file_picker: ^13.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/images/products/
  fonts:
    - family: Libre Baskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
